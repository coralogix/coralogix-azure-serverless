name: Build & Release

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: 'Specify the package to release'
        required: true
        default: 'none'
        type: choice
        options:
        - "BlobViaEventGrid"
        - "DiagnosticData"
        # - "EventHub"
        # - "BlobToOtel"
        - "StorageQueue"

permissions:
  contents: write   # create releases, and push the packageUri commit-back

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get Changed Directories
        id: changed-dirs
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c
        with:
          files_ignore: |
            **/*.md
            .github/**
            .gitignore
            AUTHORS.md
            EventHub/**
            BlobToOtel/**
            # Not a package: dir_names_max_depth 1 would otherwise put "scripts"
            # in the build matrix and fail on a missing package.json.
            scripts/**
          dir_names: true
          dir_names_max_depth: 1
          json: true
    
      - name: Build packages JSON
        id: packages
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "json=[\"${{ inputs.package }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "json=${{ steps.changed-dirs.outputs.all_changed_files }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: needs.check.outputs.packages != '[]'
    runs-on: ubuntu-latest
    needs: [check]
    strategy:
      matrix:
        package: ${{ fromJSON(needs.check.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # semantic-release derives the version from the full tag history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      
      - name: Install functools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm install

      - name: Build
        working-directory: ./${{ matrix.package }}
        run: npm run build:production

      # Same build output as before, published under the name the GitHub-release
      # packages already use. The S3 bucket is frozen: existing objects keep
      # serving existing deployments, and nothing is uploaded to it any more.
      - name: Package
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        working-directory: ./${{ matrix.package }}
        run: zip -r ${{ matrix.package }}-FunctionApp.zip . -x ".*"

      - name: Reinstall devDependencies for semantic-release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        working-directory: ./${{ matrix.package }}
        run: npm install --only=dev

      - name: Run semantic-release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        working-directory: ./${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
