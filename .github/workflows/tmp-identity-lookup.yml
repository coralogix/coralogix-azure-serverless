# Temporary: print Azure/AWS *identities* used by CI (not secret values).
# workflow_dispatch is only registered on the default branch, so this file
# also has a push trigger limited to this branch. Delete the branch and the
# workflow run after capturing the identities.
name: tmp-identity-lookup

on:
  push:
    branches: [ci/tmp-identity-lookup]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Print Azure account identity
        run: |
          az account show --query '{subscriptionId:id,subscriptionName:name,tenantId:tenantId,userName:user.name,userType:user.type}' -o json

  aws-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.CS_DEVOPS_S3_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CS_DEVOPS_S3_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Print AWS caller identity
        run: aws sts get-caller-identity
