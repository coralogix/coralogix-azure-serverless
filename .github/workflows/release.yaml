name: Build, Test & Release

# One workflow for all five packages. They previously split across two:
# release.yaml (EventHub, BlobToOtel -> GitHub Releases) and build.yaml
# (the other three -> a fixed S3 key). The split meant two different sets of
# build steps, two release models, and downstream workflows having to branch on
# which one had finished. Now that S3 is frozen and every package publishes to
# GitHub Releases, there is nothing left for the second workflow to do.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build and release"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - BlobToOtel
          - BlobViaEventGrid
          - DiagnosticData
          - EventHub
          - StorageQueue

permissions:
  contents: write   # create releases, and push the packageUri commit-back

jobs:
  detect-changes:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
      has-changes: ${{ steps.set-packages.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Explicit per-package filters rather than deriving directory names from
      # the changed paths: a derived name turns any new top-level directory
      # (scripts/, docs/) into a matrix entry that fails on a missing
      # package.json.
      - name: Detect changed packages
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            BlobToOtel:
              - 'BlobToOtel/**'
              - '!BlobToOtel/tests/**'
              - '!**/*.md'
            BlobViaEventGrid:
              - 'BlobViaEventGrid/**'
              - '!BlobViaEventGrid/tests/**'
              - '!**/*.md'
            DiagnosticData:
              - 'DiagnosticData/**'
              - '!DiagnosticData/tests/**'
              - '!**/*.md'
            EventHub:
              - 'EventHub/**'
              - '!EventHub/tests/**'
              - '!**/*.md'
            StorageQueue:
              - 'StorageQueue/**'
              - '!StorageQueue/tests/**'
              - '!**/*.md'

      - name: Set packages matrix
        id: set-packages
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          CHANGED: ${{ toJSON(steps.changes.outputs.changes) }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "workflow_dispatch" && "${INPUT_PACKAGE:-none}" != "none" ]]; then
            packages="[\"$INPUT_PACKAGE\"]"
          else
            packages=$(echo "$CHANGED" | jq -c 'fromjson')
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [[ "$packages" == "[]" ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Building: $packages"

  # Building is parallel. Releasing is not -- see the release job.
  build:
    name: Build
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One package's failure must not cancel the others: a cancelled job
      # reports as a failure with no logs, which sent an earlier investigation
      # chasing a package that had built fine.
      fail-fast: false
      max-parallel: 5
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install functools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm install

      - name: Run tests
        working-directory: ./${{ matrix.package }}
        run: npm run test

      # build:production is `npm run prestart && npm prune --production`, where
      # prestart is `npm run build && func extensions install` -- the same steps
      # the two release-tracked packages ran individually.
      - name: Build
        working-directory: ./${{ matrix.package }}
        run: npm run build:production

      - name: Zip build artifact
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        working-directory: ./${{ matrix.package }}
        run: zip -r ${{ matrix.package }}-FunctionApp.zip . -x ".*"

      # Handed to the release job so the artifact that gets published is the one
      # that was built and tested here, not a rebuild from a moved master.
      - name: Upload build artifact
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-FunctionApp
          path: ./${{ matrix.package }}/${{ matrix.package }}-FunctionApp.zip
          retention-days: 1
          if-no-files-found: error

  # Serialised, and separate from the build for exactly one reason: each release
  # pushes a packageUri commit back to master.
  #
  # Run in parallel, every job starts from the same revision and the first push
  # wins; the rest fail non-fast-forward. Serialising alone is not enough
  # either -- once an earlier job has pushed, a checkout pinned to the
  # triggering commit is *behind* the remote, and semantic-release declines with
  # "The local branch master is behind the remote one, therefore a new version
  # won't be published". A silent skip is worse than a loud failure.
  #
  # So this job checks out master as it is when the job starts, picking up any
  # commit-back an earlier package already pushed. The zip still comes from the
  # build job, so what ships is what was tested.
  release:
    name: Release
    needs: [detect-changes, build]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout master at its current tip
        uses: actions/checkout@v5
        with:
          ref: master
          # semantic-release derives the version from the full tag history, and
          # the scoped commit analysis needs the full log.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package }}-FunctionApp
          path: ./${{ matrix.package }}

      - name: Install dependencies for semantic-release
        working-directory: ./${{ matrix.package }}
        run: npm install

      - name: Run semantic-release
        working-directory: ./${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
