name: Build, Test & Release

on:
  push:
    branches:
      - "master"
    paths:
      - "EventHub/**"
      - "BlobToOtel/**"
  pull_request:
    branches:
      - "master"
    paths:
      - "EventHub/**"
      - "BlobToOtel/**"

# Two pushes arriving close together would otherwise start two runs that both
# compute a version for the same package and race to create the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write 
  pull-requests: write
  issues: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
      has-changes: ${{ steps.set-packages.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed packages
        uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            EventHub:
              - 'EventHub/**'
            BlobToOtel:
              - 'BlobToOtel/**'

      - name: Set packages matrix
        id: set-packages
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ toJSON(steps.changes.outputs.changes) }}
        run: |
          set -euo pipefail
          PACKAGES=(EventHub BlobToOtel)

          if [[ "$EVENT" == "pull_request" ]]; then
            # A PR only needs to build and test what it touches.
            packages=$(echo "$CHANGED" | jq -c 'fromjson')
          else
            # On master, ask which packages have unreleased work measured against
            # their own last tag, rather than against this push's diff.
            #
            # GitHub keeps only one pending run per concurrency group, so a third
            # push cancels the pending one. If that cancelled push was the only
            # one touching a package, a diff-based matrix would never include it
            # and its change would sit unreleased until the package happened to
            # change again. Judging from the tag makes a run pick up whatever
            # earlier runs missed.
            selected=()
            for pkg in "${PACKAGES[@]}"; do
              tag=$(git tag -l "${pkg}-v*" | sort -V | tail -1)
              if [[ -n "$(node scripts/analyze-package-commits.js "$pkg" "$tag" 2>/dev/null)" ]]; then
                selected+=("$pkg")
              fi
            done
            if [[ ${#selected[@]} -gt 0 ]]; then
              packages=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
            else
              packages='[]'
            fi
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [[ "$packages" == "[]" ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Packages: $packages"

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm install
    
      - name: Install functools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Run tests
        working-directory: ./${{ matrix.package }}
        run: npm run test

      - name: Build
        working-directory: ./${{ matrix.package }}
        run: npm run build

      - name: Install func extensions
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        working-directory: ./${{ matrix.package }}
        run: func extensions install

      - name: Prune to production dependencies
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        working-directory: ./${{ matrix.package }}
        run: npm prune --production
      
      - name: Zip build artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        working-directory: ./${{ matrix.package }}
        run: |
          zip -r ${{ matrix.package }}-FunctionApp.zip . -x ".*"

      - name: Reinstall devDependencies for semantic-release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        working-directory: ./${{ matrix.package }}
        run: npm install --only=dev

      - name: Run semantic-release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        working-directory: ./${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # The template on disk was stamped by the prepare step and published as
      # this release's asset. Hand it to the sync job, which puts it on master.
      - name: Upload stamped ARM template
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v4
        with:
          name: arm-${{ matrix.package }}
          path: ./${{ matrix.package }}/ARM/
          retention-days: 1
          if-no-files-found: error

  # master is protected with enforce_admins, so nothing can push to it directly.
  # Updates arrive as a pull request that is then merged with --admin, the same
  # way coralogix/ryu handles its automated changelog commits.
  #
  # Batched into one job rather than one push per package: a single commit for
  # the whole run, so concurrent releases cannot race each other's pushes.
  sync-package-uri:
    name: Sync packageUri
    needs: build-and-test
    # Deliberately not gated on build-and-test succeeding. If one package
    # publishes and a sibling fails, the published one still needs its template
    # on master -- skipping here would leave it advertising the previous
    # release indefinitely.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master at its current tip
        uses: actions/checkout@v5
        with:
          # Not the triggering SHA: an earlier run may have merged its own sync
          # PR since, and branching from a stale base makes this PR conflict on
          # the same packageUri line.
          ref: master
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Download stamped templates
        uses: actions/download-artifact@v4
        continue-on-error: true   # nothing to sync if every build failed
        with:
          pattern: arm-*
          path: /tmp/arm

      - name: Sync to master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          # download-artifact lays each one out as /tmp/arm/arm-<Package>/...
          shopt -s nullglob
          for dir in /tmp/arm/arm-*/; do
            pkg="$(basename "$dir")"; pkg="${pkg#arm-}"
            cp -v "$dir"* "./${pkg}/ARM/"
          done

          if git diff --quiet; then
            echo "packageUri already matches the published releases; nothing to sync."
            exit 0
          fi

          BRANCH="automated/sync-package-uri-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- '*/ARM/*'
          git commit -m "chore: sync packageUri to the published releases [skip ci]"
          git push origin "$BRANCH" --force

          cat > /tmp/pr-body.md <<'EOF'
          Opened automatically after a release.

          Each ARM template's `packageUri` is stamped with the version just published, and the same file is attached to that release as an asset. This brings master's copies in line.

          It matters because the README *Deploy to Azure* buttons deploy master's template directly. Until this lands they deploy the previous release, which exists and works; merging points them at the newest one.
          EOF

          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            PR=$(gh pr create \
              --title "chore: sync packageUri to the published releases [skip ci]" \
              --body-file /tmp/pr-body.md \
              --base master \
              --head "$BRANCH")
            PR_NUMBER="${PR##*/}"
          fi
          gh pr merge "$PR_NUMBER" --admin --squash --delete-branch
