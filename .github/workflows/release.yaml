name: Build, Test & Release

# One workflow for all five packages. They previously split across two:
# release.yaml (EventHub, BlobToOtel -> GitHub Releases) and build.yaml (the
# other three -> a fixed S3 key). That meant two sets of build steps, two
# release models, and downstream workflows having to branch on which one
# finished. With S3 frozen and every package publishing to GitHub Releases,
# there is nothing left for a second workflow to do.
#
# After releasing, the stamp-templates job brings master's checked-in ARM
# templates back in sync with the releases just cut -- see that job for why it
# opens a PR instead of pushing.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build and release"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - BlobToOtel
          - BlobViaEventGrid
          - DiagnosticData
          - EventHub
          - StorageQueue

# Two pushes arriving close together would otherwise start two runs that both
# compute a version for the same package and race to create the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # create releases and tags
  pull-requests: read    # dorny/paths-filter reads changed files via the PR API

jobs:
  detect-changes:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
      has-changes: ${{ steps.set-packages.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Explicit per-package filters rather than deriving directory names from
      # the changed paths: a derived name turns any new top-level directory
      # (scripts/, docs/) into a matrix entry that fails on a missing
      # package.json.
      #
      # tests/ and markdown are included deliberately. They cannot cause a
      # release -- the commit type and the scoped analysis decide that -- but a
      # change to them should still be built and tested.
      - name: Detect changed packages
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            BlobToOtel:
              - 'BlobToOtel/**'
            BlobViaEventGrid:
              - 'BlobViaEventGrid/**'
            DiagnosticData:
              - 'DiagnosticData/**'
            EventHub:
              - 'EventHub/**'
            StorageQueue:
              - 'StorageQueue/**'

      - name: Set packages matrix
        id: set-packages
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          CHANGED: ${{ toJSON(steps.changes.outputs.changes) }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "workflow_dispatch" && "${INPUT_PACKAGE:-none}" != "none" ]]; then
            packages="[\"$INPUT_PACKAGE\"]"
          else
            packages=$(echo "$CHANGED" | jq -c 'fromjson')
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [[ "$packages" == "[]" ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Packages: $packages"

  build:
    name: Build
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One package's failure must not cancel the others: a cancelled job
      # reports as a failure with no logs, which is needlessly hard to diagnose.
      fail-fast: false
      max-parallel: 5
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # semantic-release derives the version from the full tag history, and
          # the scoped commit analysis needs the full log.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install functools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm install

      - name: Run tests
        working-directory: ./${{ matrix.package }}
        run: npm run test

      # build:production is `npm run prestart && npm prune --production`, where
      # prestart is `npm run build && func extensions install` -- the same steps
      # the two release-tracked packages ran as separate stages.
      - name: Build
        working-directory: ./${{ matrix.package }}
        run: npm run build:production

      - name: Zip build artifact
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        working-directory: ./${{ matrix.package }}
        run: zip -r ${{ matrix.package }}-FunctionApp.zip . -x ".*"

      - name: Reinstall devDependencies for semantic-release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        working-directory: ./${{ matrix.package }}
        run: npm install --only=dev

      - name: Run semantic-release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        working-directory: ./${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # semantic-release stamps the ARM template with the version being released
  # and publishes it as a release asset, but that rewrite lives only in the
  # runner workspace -- master's checked-in template keeps naming the previous
  # release, and that checked-in copy is what the README "Deploy to Azure"
  # buttons deploy. Committing back with @semantic-release/git is not an option:
  # master is protected with enforce_admins and required signatures, so nothing
  # can push to it outside a PR. Instead, stamp master's copy here and open a PR
  # with the diff. A human approves and merges it; the commit is typed chore,
  # so merging it cuts no new release -- and this job then no-ops, because the
  # template already matches the tag.
  stamp-templates:
    name: Stamp templates (${{ matrix.package }})
    needs: [detect-changes, build]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the stamp branch
      pull-requests: write   # open the stamp PR
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The tag created by this run's build job points at the commit under
          # test, so a full fetch brings it along with the history.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Stamp packageUri to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail

          tag=$(git tag -l "${PACKAGE}-v*" | sort -V | tail -1)
          if [[ -z "$tag" ]]; then
            echo "No ${PACKAGE}-v* tag exists; nothing to stamp." >&2
            exit 1
          fi
          version=${tag#"${PACKAGE}-v"}

          case "$PACKAGE" in
            EventHub) template="EventHub/ARM/EventHubV2.json" ;;
            *)        template="${PACKAGE}/ARM/${PACKAGE}.json" ;;
          esac

          node scripts/set-package-uri.js "$PACKAGE" "$template" "$version"

          if git diff --quiet -- "$template"; then
            echo "$template already points at $tag; nothing to do."
            exit 0
          fi

          branch="chore/stamp-$(echo "$PACKAGE" | tr '[:upper:]' '[:lower:]')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$template"
          git commit -m "chore(${PACKAGE}): point packageUri at ${tag}"
          # Force push: the branch may exist from an earlier stamp whose PR has
          # not been merged yet; this reruns it on current master.
          git push --force origin "$branch"

          open_prs=$(gh pr list --head "$branch" --base master --state open --json number --jq 'length')
          if [[ "$open_prs" -eq 0 ]]; then
            gh pr create \
              --head "$branch" \
              --base master \
              --title "chore(${PACKAGE}): point packageUri at ${tag}" \
              --body "Updates the checked-in \`$template\` to the [$tag](https://github.com/coralogix/coralogix-azure-serverless/releases/tag/$tag) release asset. The release asset itself is already correct; this keeps master's template -- what the Deploy to Azure button deploys -- in sync. Typed \`chore\`, so merging cuts no new release."
          else
            echo "Stamp PR for $branch already open; updated its branch."
          fi
